# blumnAI QA Bot — 사내 배포 (형태 Y · Phase Y1a)
#
# 사용자 접속 URL은 http://localhost:3001 하나만.
# 백엔드는 프론트 Next.js rewrites 로 /api 프록시 → 브라우저는 3001 로만 통신.
# (백엔드 3000 은 디버깅용 · 브라우저 접속 X)
#
# 실행: docker compose up -d --build
# 로그: docker compose logs -f
# 정지: docker compose down (볼륨은 남김) / down -v (완전 삭제)

services:
  mysql:
    image: mysql:8.0
    container_name: blumnai-qa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    container_name: blumnai-qa-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}"
      # 프록시 방식이라 브라우저는 직접 백엔드 호출 X.
      # frontend 컨테이너 이름만 허용하면 되지만, 개발 편의상 localhost:3001 도 허용.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3001,http://frontend:3001}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    # 백엔드 외부 노출 (디버깅용 · 브라우저는 이 포트 안 씀)
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    command: sh -c "npx prisma migrate deploy && node dist/main"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: blumnai-qa-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      # Next.js rewrites 로 /api → backend 컨테이너 프록시 (Docker 네트워크 내부)
      BACKEND_INTERNAL_URL: http://backend:3000
      # 브라우저측 API base URL은 상대 경로 (/api) — 같은 origin 이라 CORS 없음
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    # ⭐ 사용자 접속 URL — 이 포트 하나만 사용
    ports:
      - "${FRONTEND_PORT:-3001}:3001"

volumes:
  mysql-data:
    driver: local
